<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shtora — interactive preview</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f4f2;color:#171717;font:15px/1.4 system-ui,-apple-system,Segoe UI,sans-serif}
.app{width:min(100%,430px);min-height:100vh;margin:auto;background:#fff;border-left:1px solid #ddd;border-right:1px solid #ddd}
header{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid #e5e5e5}
.logo{font-size:25px;font-weight:700}.muted{color:#777}.small{font-size:11px;letter-spacing:.14em;text-transform:uppercase}
button{border:0;background:none;color:inherit;cursor:pointer}header button,.icon{padding:9px;border-radius:50%}
.stories{display:flex;gap:14px;overflow:auto;padding:16px}.story{flex:0 0 62px;text-align:center;font-size:11px;color:#777}.avatar{width:58px;height:58px;border-radius:50%;border:2px solid #222;display:grid;place-items:center;margin:auto auto 5px;font-weight:600}
.post{border-top:1px solid #e5e5e5;border-bottom:1px solid #e5e5e5}.posthead{display:flex;align-items:center;gap:9px;padding:12px 16px}.postavatar{width:36px;height:36px;border-radius:50%;background:#eee;display:grid;place-items:center;font-weight:600}
.photo{aspect-ratio:4/5;background:linear-gradient(145deg,#eee,#d9d9d5);padding:24px;display:flex;flex-direction:column;justify-content:end}.photo .title{font-size:31px;font-weight:700}.actions{display:flex;gap:2px;padding:8px}.actions .save{margin-left:auto}.likes{padding:0 16px 16px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}.tile{aspect-ratio:1;background:#eee;padding:10px;text-align:left}
section{padding:20px}.profiletop{display:flex;gap:16px;align-items:center}.bigavatar{width:82px;height:82px;border-radius:50%;background:#eee;display:grid;place-items:center;font-size:28px;font-weight:700}
.messages{display:flex;flex-direction:column;gap:7px;margin-top:18px}.msg{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;text-align:left}.msg:hover{background:#f2f2f0}
nav{position:sticky;bottom:0;height:64px;border-top:1px solid #e5e5e5;background:rgba(255,255,255,.96);display:flex;justify-content:space-around;align-items:center}
nav button{font-size:23px;padding:10px}.hidden{display:none}.back{font-size:22px}
</style>
</head>
<body><div class="app">
<header><button id="back" class="back hidden">‹</button><span id="logo" class="logo">Штора</span><span class="small muted">preview</span><button onclick="show('inbox')">✉</button></header>
<div id="content"></div>
<nav>
<button onclick="show('home')">⌂</button><button onclick="show('search')">⌕</button><button onclick="show('inbox')">♡</button><button onclick="show('profile')">◯</button>
</nav>
</div>
<script>
let liked=false,saved=false,screen='home';
const names=['you','lena','mira','nika','anna'];
function show(s){screen=s;document.getElementById('back').classList.toggle('hidden',s==='home');render()}
document.getElementById('back').onclick=()=>show('home');
function render(){
 const c=document.getElementById('content'), logo=document.getElementById('logo');
 logo.textContent=screen==='home'?'Штора':'';
 if(screen==='home') c.innerHTML=`
 <div class="stories">${names.map((n,i)=>'<button class="story" onclick="show(\\'profile\\')"><div class="avatar" style="border-color:'+(i?'#ddd':'#222')+'">'+n[0].toUpperCase()+'</div>'+n+'</button>').join('')}</div>
 <article class="post">
 <div class="posthead"><button onclick="show('profile')" class="postavatar">L</button><b>lena</b><span class="muted" style="margin-left:auto">•••</span></div>
 <button class="photo" style="width:100%;text-align:left" onclick="show('profile')"><span class="small muted">moment 07:42</span><span class="title">morning light</span><span class="muted">casual frame · no filter · apartment</span></button>
 <div class="actions"><button class="icon" onclick="liked=!liked;render()">♡</button><button class="icon" onclick="show('inbox')">○</button><button class="icon">↗</button><button class="icon save" onclick="saved=!saved;render()">🔖</button></div>
 <div class="likes"><b>${liked?'128':'127'}</b> likes · <span class="muted">today</span></div></article>`;
 else if(screen==='profile') c.innerHTML=`<section><div class="profiletop"><div class="bigavatar">L</div><div><h2 style="margin:0">lena</h2><span class="muted">ordinary life, captured quietly</span></div></div><div class="grid" style="margin-top:24px">${[1,2,3,4,5,6].map(n=>'<button class="tile" onclick="show(\\'home\\')">frame '+n+'</button>').join('')}</div></section>`;
 else if(screen==='search') c.innerHTML=`<section><div style="background:#eee;border-radius:12px;padding:11px;color:#777">⌕ Search</div><div class="grid" style="margin-top:18px;grid-template-columns:1fr 1fr">${['lena','mira','nika','anna'].map(n=>'<button class="tile" style="aspect-ratio:auto;border-radius:14px" onclick="show(\\'profile\\')"><b>'+n[0].toUpperCase()+' &nbsp; '+n+'</b><br><span class="muted">profile</span></button>').join('')}</div></section>`;
 else c.innerHTML=`<section><h2 style="font-size:28px;margin-top:0">Messages</h2><div class="messages">${['lena','mira','nika'].map(n=>'<button class="msg" onclick="show(\\'profile\\')"><span class="avatar" style="margin:0;width:44px;height:44px;border:0;background:#eee">'+n[0].toUpperCase()+'</span><span><b>'+n+'</b><br><span class="muted">Tap to open chat preview</span></span></button>').join('')}</div></section>`;
}
render();
</script></body></html>
