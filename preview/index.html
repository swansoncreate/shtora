<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Штора — UI preview</title>
<style>
:root{--bg:#0e0d0c;--surface:#171513;--elev:#211e1b;--border:rgba(244,239,230,.12);--text:#f4efe6;--muted:#a8a098;--subtle:#716b64;--accent:#d5b67a;--danger:#d66b6b}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.42 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100dvh}
button,input,textarea{font:inherit;color:inherit}button{cursor:pointer}.app{width:min(100%,760px);margin:0 auto;min-height:100dvh}
header{position:sticky;top:0;z-index:20;border-bottom:1px solid var(--border);background:rgba(14,13,12,.93);backdrop-filter:blur(18px);padding:12px 16px}
.brand{font:600 40px/1 "Georgia",serif;letter-spacing:-.04em}.sub{color:var(--muted);font-size:12px;margin-top:5px}
.headrow{display:flex;gap:12px;align-items:flex-start}.grow{flex:1}
.icon{width:44px;height:44px;border:0;border-radius:12px;background:transparent;display:grid;place-items:center}.icon:hover{background:var(--elev)}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--elev);padding:4px;border-radius:12px;margin-top:12px}.tab{height:40px;border:0;border-radius:9px;background:none;color:var(--muted)}.tab.active{background:var(--surface);color:var(--text)}
main{padding:18px 16px 50px}.row{display:flex;gap:8px}.input,.textarea{width:100%;border:1px solid var(--border);background:var(--surface);border-radius:12px;padding:12px 13px;outline:none}.input{height:46px}.textarea{min-height:120px;resize:vertical}.input:focus,.textarea:focus{border-color:rgba(213,182,122,.55)}
.btn{height:44px;border:1px solid var(--border);border-radius:12px;background:var(--surface);padding:0 15px}.btn.primary{background:var(--text);color:var(--bg);border-color:var(--text)}.btn.subtle{background:var(--elev)}.btn.ghost{background:transparent;border-color:transparent}
.stories{display:flex;gap:14px;overflow:auto;padding:15px 2px 10px}.story{width:72px;flex:none;text-align:center;border:0;background:none}.avatar{width:64px;height:64px;margin:auto;border-radius:50%;padding:3px;background:var(--border)}.story.active .avatar{background:linear-gradient(135deg,var(--danger),var(--accent))}.avatar>span{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:var(--elev);font:500 24px Georgia,serif}.story small{display:block;margin-top:6px;color:var(--muted);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card,.panel{border:1px solid var(--border);background:var(--surface);border-radius:16px;overflow:hidden}.card{margin-top:10px}.cardhead{display:flex;align-items:center;gap:10px;padding:12px 14px}.mini{width:40px;height:40px;border-radius:50%;background:var(--elev);display:grid;place-items:center;font:500 18px Georgia,serif}.meta b{display:block;font-size:14px}.meta span{display:block;color:var(--subtle);font-size:12px;margin-top:2px}.media{width:100%;aspect-ratio:4/5;background:linear-gradient(145deg,#5a554f,#d1b08a 55%,#ebe0cc);position:relative}.media.alt{background:linear-gradient(145deg,#3c4038,#727b61 55%,#b7b29c)}.media.night{background:linear-gradient(145deg,#111419,#28313c 60%,#55606f)}.media.rose{background:linear-gradient(145deg,#645355,#c5a2a0)}.media.gold{background:linear-gradient(145deg,#5c4a3c,#bb8d52 55%,#dfc18f)}.media:after{content:"preview frame";position:absolute;left:14px;bottom:14px;color:rgba(255,255,255,.7);font-size:10px;letter-spacing:.18em;text-transform:uppercase}.actions{display:flex;gap:2px;padding:7px 9px}.likes{padding:0 14px 5px;font-size:13px}.caption{padding:0 14px 14px;font-size:14px}.muted{color:var(--muted)}
.profile{padding:16px}.profiletop{display:flex;gap:15px}.big{width:86px;height:86px;border-radius:50%;background:var(--elev);display:grid;place-items:center;flex:none;font:500 30px Georgia,serif}.name{font:500 28px/1 Georgia,serif}.stats{display:flex;gap:18px;margin-top:12px;font-size:12px}.stats b{font-size:16px}.pills{display:flex;gap:8px;overflow:auto;margin-top:14px}.pill{border:1px solid var(--border);background:var(--elev);border-radius:999px;padding:8px 12px;font-size:12px;white-space:nowrap}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;margin-top:14px}.grid .tile{aspect-ratio:1}.tile{position:relative;overflow:hidden}
.filehead{display:flex;gap:8px;align-items:center}.path{flex:1;padding:12px;border:1px solid var(--border);border-radius:12px;background:var(--surface);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chips{display:flex;gap:8px;overflow:auto;padding:12px 0}.chip{border:0;background:var(--elev);border-radius:999px;padding:8px 13px;color:var(--muted);white-space:nowrap}.chip.active{background:var(--text);color:var(--bg)}.filegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}.file{aspect-ratio:1;border:0;padding:0;background:var(--elev);position:relative;overflow:hidden;border-radius:8px}.check{position:absolute;top:7px;right:7px;width:24px;height:24px;border-radius:50%;background:var(--text);color:var(--bg);display:none;place-items:center;font-size:12px}.file.selected .check{display:grid}.tag{position:absolute;left:6px;top:6px;border-radius:999px;background:rgba(14,13,12,.72);padding:5px 7px;font-size:9px}
.studio{padding:16px}.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--elev);padding:4px;border-radius:12px}.seg button{height:38px;border:0;border-radius:9px;background:transparent;color:var(--muted)}.seg button.active{background:var(--surface);color:var(--text)}.sources{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.source{aspect-ratio:1;border-radius:12px;background:var(--elev);padding:8px}.source>div{width:100%;height:100%;border-radius:9px;background:linear-gradient(145deg,#474039,#a28d75);display:flex;align-items:flex-end;padding:8px;font-size:9px;letter-spacing:.14em;color:rgba(255,255,255,.72)}.resultgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
.modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.72);display:none;align-items:flex-end;backdrop-filter:blur(8px)}.modal.open{display:flex}.sheet{width:min(100%,760px);max-height:92dvh;overflow:auto;margin:0 auto;background:var(--surface);border:1px solid var(--border);border-bottom:0;border-radius:20px 20px 0 0;padding:16px 16px max(20px,env(safe-area-inset-bottom))}.sheet.center{align-self:center;border-bottom:1px solid var(--border);border-radius:20px;margin:18px}.sheethead{display:flex;align-items:center;gap:10px}.sheettitle{font:500 28px Georgia,serif}.close{margin-left:auto}.list{display:flex;flex-direction:column;gap:8px;margin-top:12px}.listrow{width:100%;display:flex;align-items:center;gap:12px;border:1px solid var(--border);background:var(--elev);border-radius:14px;padding:11px;text-align:left}.listrow .grow{min-width:0}.listrow small{color:var(--muted);display:block;margin-top:3px}.section{margin-top:18px}.section h4{margin:0 0 8px;font-size:13px}.field{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:12px}.toggle{width:48px;height:28px;border:0;border-radius:999px;background:var(--elev);position:relative}.toggle.on{background:var(--text)}.toggle i{position:absolute;top:4px;left:4px;width:20px;height:20px;border-radius:50%;background:var(--bg);transition:.15s}.toggle.on i{left:24px}.chathead{display:flex;gap:9px;align-items:center;border-bottom:1px solid var(--border);padding-bottom:12px}.messages{display:flex;flex-direction:column;gap:8px;padding:16px 0;min-height:45dvh}.bubble{max-width:78%;padding:9px 12px;border-radius:16px;background:var(--elev);font-size:14px}.bubble.me{margin-left:auto;background:var(--accent);color:#17120c}.composer{display:flex;gap:8px;border-top:1px solid var(--border);padding-top:12px}
@media(min-width:760px){main{padding-left:0;padding-right:0}}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="headrow">
    <div class="grow"><div class="brand">Штора</div><div class="sub" id="sub">UI preview · offline</div></div>
    <button class="icon" id="settingsBtn" aria-label="Настройки">⚙</button>
  </div>
  <div class="tabs">
    <button class="tab active" data-app="instagram">Instagram</button>
    <button class="tab" data-app="files">Файлы</button>
    <button class="tab" data-app="imagine">Imagine</button>
  </div>
</header>
<main id="main"></main>
</div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>

<script>
const state={app:"instagram",profile:null,folder:"Штора",selected:new Set(),liked:false,saved:false,imagineMode:"photo",generated:0,thread:null,messages:{lena:["ты опять без сна?","я потом скину кадр","если не усну первой"],mira:["у меня сегодня тихий день","после восьми буду свободна"],nika:["посмотрела 👀"]},settingsTab:"insta",autoSave:true};
const people=["you","lena","mira","nika","anna"];
const media=[
 {id:"1",name:"morning-light.jpg",cls:""}, {id:"2",name:"window-01.jpg",cls:"alt"}, {id:"3",name:"kitchen.jpg",cls:"alt"},
 {id:"4",name:"street.mov",cls:"night"}, {id:"5",name:"mirror.jpg",cls:"rose"}, {id:"6",name:"late-sun.jpg",cls:"gold"}
];
const $=s=>document.querySelector(s);
const main=$("#main");
function avatar(name,large=false){return '<div class="'+(large?"big":"mini")+'">'+String(name||"Ш")[0].toUpperCase()+'</div>'}
function openModal(html,center=false){$("#sheet").className="sheet"+(center?" center":"");$("#sheet").innerHTML=html;$("#modal").classList.add("open")}
function closeModal(){$("#modal").classList.remove("open")}
$("#modal").addEventListener("click",e=>{if(e.target===$("#modal"))closeModal()});
function render(){
  document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.app===state.app));
  $("#sub").textContent=state.app==="instagram"?(state.profile?"@"+state.profile:"UI preview · offline"):state.app==="files"?"Файлы · UI preview":"Imagine · UI preview";
  if(state.app==="instagram") return state.profile?renderProfile():renderInstagram();
  if(state.app==="files") return renderFiles();
  renderImagine();
}
function renderInstagram(){
  let html='<div class="row"><input id="search" class="input" placeholder="поиск по нику"><button class="btn subtle" id="searchBtn">Искать</button><button class="btn subtle" id="chatBtn">💬</button></div>';
  html+='<div class="stories">'+people.map((n,i)=>'<button class="story '+(i===0?"active":"")+'" onclick="goProfile(\''+n+'\')">'+avatar(n)+'<small>'+n+'</small></button>').join("")+'</div>';
  html+='<article class="card"><div class="cardhead">'+avatar("lena")+'<div class="meta"><b>lena</b><span>today · apartment</span></div><div class="grow"></div><button class="icon">•••</button></div>';
  html+='<button style="display:block;width:100%;border:0;background:none;padding:0" onclick="goProfile(\'lena\')"><div class="media"></div></button>';
  html+='<div class="actions"><button class="icon" onclick="toggleLike()">♡</button><button class="icon" onclick="openChats()">◌</button><button class="icon">↗</button><button class="icon" onclick="toggleSave()" style="margin-left:auto">⌑</button></div>';
  html+='<div class="likes"><b>'+(state.liked?"128":"127")+'</b> отметок «Нравится»</div><div class="caption"><b>lena</b> morning light, no filter, quiet apartment.</div></article>';
  html+='<div class="panel" style="margin-top:14px;padding:16px"><b>UI playground</b><div class="muted" style="margin-top:5px">Здесь можно оценивать композицию, навигацию, чаты и настройки без backend.</div></div>';
  main.innerHTML=html;
  $("#searchBtn").onclick=()=>{const n=$("#search").value.trim().replace(/^@/,"");if(n)goProfile(n)};
  $("#chatBtn").onclick=openChats;
}
function renderProfile(){
  const n=state.profile; let html='<button class="btn ghost" id="back">← Лента</button><section class="panel profile" style="margin-top:8px"><div class="profiletop">'+avatar(n,true)+'<div><div class="name">'+n+'</div><div class="muted" style="margin-top:4px">@'+n+'</div><div class="stats"><span><b>18</b> посты</span><span><b>4</b> сторис</span><span><b>3</b> highlights</span></div></div></div>';
  html+='<div class="row" style="margin-top:14px"><button class="btn" id="write">Написать</button><button class="btn" onclick="toast('Только UI')">Сохранить</button><button class="btn" onclick="toast('Обновление отключено')">Обновить</button></div>';
  html+='<div class="pills"><button class="pill">morning</button><button class="pill">home</button><button class="pill">weekend</button></div></section><div class="grid">';
  media.forEach((m,i)=>html+='<button class="tile" style="border:0" onclick="openMedia(\''+m.id+'\')"><div class="media '+m.cls+'" style="height:100%"></div></button>');
  html+='</div>'; main.innerHTML=html; $("#back").onclick=()=>{state.profile=null;render()}; $("#write").onclick=()=>openChat(n);
}
function renderFiles(){
 let html='<div class="filehead"><div class="path">/'+state.folder+'</div><button class="btn subtle" onclick="toast('Фильтры UI')">☷</button></div><div class="chips">';
 ["Штора","общее","lena","mira","nika"].forEach(n=>html+='<button class="chip '+(state.folder===n?"active":"")+'" onclick="state.folder=\''+n+'\';state.selected.clear();render()">'+n+'</button>');
 html+='</div>';
 if(state.selected.size) html+='<div class="panel" style="padding:9px;margin-bottom:10px;display:flex;align-items:center;gap:8px"><span>'+state.selected.size+' выбрано</span><span class="grow"></span><button class="btn subtle" onclick="state.selected.clear();render()">Снять</button><button class="btn subtle" onclick="toast('Удаление отключено')">🗑</button></div>';
 html+='<div class="filegrid">';
 media.forEach((m,i)=>{const on=state.selected.has(m.id);html+='<button class="file '+(on?"selected":"")+'" onclick="toggleFile(\''+m.id+'\')"><div class="media '+m.cls+'" style="height:100%"></div>'+(i<2?'<span class="tag">В ленте</span>':"")+'<span class="check">✓</span></button>'});
 html+='</div>'; main.innerHTML=html;
}
function toggleFile(id){if(state.selected.size||state.selected.has(id)){state.selected.has(id)?state.selected.delete(id):state.selected.add(id)}else openMedia(id);render()}
function renderImagine(){
 let html='<section class="panel studio"><div class="seg">';
 ["photo","live","edit"].forEach(m=>html+='<button class="'+(state.imagineMode===m?"active":"")+'" onclick="state.imagineMode=\''+m+'\';render()">'+(m==="photo"?"Фото":m==="live"?"Live":"Edit")+'</button>');
 html+='</div><h2 style="font:500 28px Georgia,serif;margin:16px 0 4px">Imagine studio</h2><div class="muted">Только UI. Нажатие «Собрать» меняет локальное состояние и ничего не отправляет.</div>';
 html+='<div class="sources">'+["source","source-2","history"].map(x=>'<button class="source" onclick="toast(\''+x+'\')"><div>'+x+'</div></button>').join("")+'</div>';
 html+='<textarea class="textarea" id="prompt" placeholder="Опиши сцену…">утро, тёплый свет, телефонный кадр, без постановки</textarea><div class="row" style="margin-top:10px"><button class="btn subtle">x1</button><button class="btn subtle">x2</button><button class="btn subtle">x4</button><span class="grow"></span><button class="btn primary" onclick="state.generated++;render()">✦ Собрать</button></div></section>';
 html+='<section style="margin-top:18px"><div class="headrow"><b>Результаты</b><span class="grow"></span><span class="muted">'+(state.generated?state.generated+" локальных":"пока пусто")+'</span></div><div class="resultgrid">';
 const count=Math.max(2,state.generated); for(let i=0;i<count;i++) html+='<div class="tile" style="aspect-ratio:4/5;border-radius:12px;overflow:hidden"><div class="media '+(i%2?"alt":"")+" style="height:100%"></div></div>";
 html+='</div></section>'; main.innerHTML=html;
}
function goProfile(n){state.profile=n;state.app="instagram";render()}
function toggleLike(){state.liked=!state.liked;render()}
function toggleSave(){state.saved=!state.saved;toast(state.saved?"Сохранено локально":"Убрано локально");render()}
function openMedia(id){const m=media.find(x=>x.id===id);openModal('<div class="sheethead"><div class="sheettitle">'+m.name+'</div><button class="icon close" onclick="closeModal()">×</button></div><div class="media '+m.cls+'" style="margin-top:12px;aspect-ratio:4/5;border-radius:14px"></div><div class="row" style="margin-top:12px"><button class="btn subtle">В ленту</button><button class="btn primary" style="margin-left:auto" onclick="closeModal()">Готово</button></div>')}
function openChats(){const rows=["lena","mira","nika"].map(n=>'<button class="listrow" onclick="openChat(\''+n+'\')">'+avatar(n)+'<div class="grow"><b>'+n+'</b><small>'+state.messages[n][state.messages[n].length-1]+'</small></div><span>›</span></button>').join("");openModal('<div class="sheethead"><div class="sheettitle">Чаты</div><button class="icon close" onclick="closeModal()">×</button></div><div class="list">'+rows+'</div>')}
function openChat(n){state.thread=n;const msgs=state.messages[n]||[];openModal('<div class="chathead">'+avatar(n)+'<div class="grow"><b>'+n+'</b><div class="muted" style="font-size:11px">online · preview</div></div><button class="icon" onclick="openChatSettings(\''+n+'\')">☷</button><button class="icon" onclick="closeModal()">×</button></div><div class="messages" id="msgs">'+msgs.map((m,i)=>'<div class="bubble '+(i%2?"me":"")+'">'+escapeHtml(m)+'</div>').join("")+'<div class="bubble">печатает…</div></div><form class="composer" onsubmit="sendMessage(event,\''+n+'\')"><input class="input" id="msg" placeholder="Сообщение"><button class="btn primary">↗</button></form>')}
function sendMessage(e,n){e.preventDefault();const v=$("#msg").value.trim();if(!v)return;(state.messages[n] ||= []).push(v);openChat(n)}
function openChatSettings(n){openModal('<div class="sheethead"><div class="sheettitle">Настройки чата</div><button class="icon close" onclick="closeModal()">×</button></div><div class="section"><h4>Предыстория</h4><div class="field muted">UI-only preview</div></div><div class="section"><h4>Тон</h4><div class="row"><button class="btn subtle">Спокойный</button><button class="btn subtle">Тёплый</button><button class="btn subtle">Игривый</button></div></div>')}
function openSettings(){const tabs=[["insta","Инста"],["dropbox","Диск"],["chat","Чат"],["more","Ещё"]];let html='<div class="sheethead"><div class="sheettitle">Настройки</div><button class="icon close" onclick="closeModal()">×</button></div><div class="seg" style="margin-top:12px">'+tabs.map(([id,l])=>'<button class="'+(state.settingsTab===id?"active":"")+'" onclick="state.settingsTab=\''+id+'\';openSettings()">'+l+'</button>').join("")+'</div>';const t=state.settingsTab;
 if(t==="insta") html+='<div class="section"><h4>Apify</h4><div class="field muted">apify_api_… · задан</div><div style="margin-top:10px"><button class="btn subtle">Сохранить</button></div></div><div class="section"><h4>Избранное</h4><div class="pills"><span class="pill">@lena</span><span class="pill">@mira</span><span class="pill">@nika</span></div></div>';
 if(t==="dropbox") html+='<div class="section"><h4>Подключение</h4><div class="field">Подключено</div></div><div class="section"><h4>Папки</h4><div class="field">/Штора</div><div class="field" style="margin-top:8px">/Штора/lena</div><div class="field" style="margin-top:8px">/Штора/общее</div></div><div class="section"><h4>Автосохранение</h4><div class="headrow"><span class="grow">Сторис и новые посты</span><button class="toggle '+(state.autoSave?"on":"")+'" onclick="state.autoSave=!state.autoSave;openSettings()"><i></i></button></div></div>';
 if(t==="chat") html+='<div class="section"><h4>Кто пишет</h4><div class="row"><button class="btn primary">Grok</button><button class="btn subtle">Claude</button></div></div><div class="section"><h4>Модель</h4><div class="field">grok</div></div>';
 if(t==="more") html+='<div class="section"><h4>Интерфейс</h4><div class="headrow"><span class="grow">UI preview mode</span><span class="pill">offline</span></div></div><div class="section"><h4>Кэш</h4><button class="btn subtle" onclick="toast(\'Локальный preview очищен\')">Очистить</button></div>';
 openModal(html)}
function toast(text){const t=document.createElement("div");t.textContent=text;t.style="position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:90;background:#f4efe6;color:#0e0d0c;padding:10px 14px;border-radius:999px;font-size:12px;box-shadow:0 10px 30px #0008";document.body.appendChild(t);setTimeout(()=>t.remove(),1400)}
function escapeHtml(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{state.app=b.dataset.app;state.profile=null;state.selected.clear();render()});
$("#settingsBtn").onclick=openSettings; render();
</script>
</body>
</html>
