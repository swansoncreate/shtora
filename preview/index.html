function chats(){return '<div class="fixed inset-0 z-50 flex flex-col bg-bg"><header class="flex items-center justify-between px-3 py-3 sm:px-5"><p class="flex items-center gap-2 font-display text-xl">Чаты <span class="flex h-5 min-w-5 items-center justify-center rounded-full bg-danger px-1 text-[10px]">2</span></p><button data-close class="grid size-10 place-items-center">×</button></header><div class="min-h-0 flex-1 overflow-y-auto">'+P.map((p,i)=>'<button class="flex w-full items-center gap-3 px-4 py-3 text-left hover:bg-elevated" data-chatuser="'+p.u+'">'+avatar(p,"size-12")+'<span class="min-w-0 flex-1"><span class="flex items-center justify-between"><span class="truncate text-sm font-medium">'+p.n+'</span><span class="flex h-5 min-w-5 items-center justify-center rounded-full bg-danger px-1 text-[10px]">'+(i<2?i+1:0)+'</span></span><span class="mt-0.5 block truncate text-xs text-muted">'+(i===0?"Ты где? Я уже в пути.":"последнее сообщение")+'</span></span></button>').join("")+'</div></div>'}
function thread(u){const p=P.find(x=>x.u===u)||P[0];return '<div class="fixed inset-0 z-50 flex flex-col bg-bg"><header class="flex items-center gap-2 border-b border-border px-3 py-3"><button id="chatBack" class="grid size-10 place-items-center rounded-lg">←</button>'+avatar(p,"size-10")+'<div class="min-w-0 flex-1"><p class="truncate text-sm font-medium">'+p.n+'</p><p class="text-xs text-muted">@'+p.u+' · спокойно</p></div><button data-close class="grid size-10 place-items-center">×</button></header><div class="min-h-0 flex-1 space-y-2 overflow-y-auto px-4 py-5"><div class="flex justify-start"><div class="max-w-[78%] rounded-2xl bg-elevated px-3.5 py-2.5 text-sm">Ты где? Я уже в пути.</div></div><div class="flex justify-end"><div class="max-w-[78%] rounded-2xl bg-fg px-3.5 py-2.5 text-sm text-bg">Еду. Буду через десять минут.</div></div><div class="flex justify-start"><div class="max-w-[78%] rounded-2xl bg-elevated px-3.5 py-2.5 text-sm">Окей, жду.</div></div></div><div class="border-t border-border px-3 py-3"><div class="flex gap-2"><input class="h-11 min-w-0 flex-1 rounded-xl border border-border bg-surface px-3 text-sm" placeholder="Сообщение"/><button class="grid size-11 place-items-center rounded-xl bg-fg text-bg">↑</button></div></div></div>'}
function image(src){return '<div class="fixed inset-0 z-[70] grid place-items-center bg-bg/90 p-4" data-close><div class="relative max-h-[92dvh] max-w-3xl" onclick="event.stopPropagation()"><button data-close class="absolute -right-2 -top-12 grid size-10 place-items-center text-2xl">×</button><img src="'+esc(src)+'" class="max-h-[88dvh] max-w-full rounded-xl object-contain shadow-border"/></div></div>'}
function modal(x){document.getElementById("modalRoot").innerHTML=x;refreshIcons();document.querySelectorAll("#modalRoot [data-close]").forEach(e=>e.onclick=()=>document.getElementById("modalRoot").innerHTML="");const sb=document.getElementById("settingsBody");if(sb){sb.innerHTML=settingsBody("insta");refreshIcons()}document.querySelectorAll("#modalRoot [data-chatuser]").forEach(e=>e.onclick=()=>modal(thread(e.dataset.chatuser)));document.querySelectorAll("#modalRoot [data-stab]").forEach(e=>e.onclick=()=>{const tab=e.dataset.stab;document.querySelectorAll("#modalRoot [data-stab]").forEach(x=>x.className=x.className.replace(" bg-surface text-fg shadow-border","")+" text-muted");e.className=e.className.replace(" text-muted","")+" bg-surface text-fg shadow-border";const body=document.getElementById("settingsBody");if(body)body.innerHTML=settingsBody(tab);refreshIcons()});const cb=document.getElementById("chatBack");if(cb)cb.onclick=()=>modal(chats())}
function wire(){const rf=document.getElementById("refreshFeed");if(rf)rf.onclick=()=>{const i=rf.querySelector("[data-lucide]");if(i)i.classList.add("animate-spin");window.setTimeout(()=>{if(i)i.classList.remove("animate-spin")},650)};document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;activeProfile=null;document.querySelectorAll(".tab").forEach(x=>x.className=x.className.replace(" bg-surface text-fg shadow-border","")+" text-muted");b.className=b.className.replace(" text-muted","")+" bg-surface text-fg shadow-border";render()});document.querySelectorAll("[data-prof]").forEach(b=>b.onclick=()=>{activeProfile=b.dataset.prof;render()});document.querySelectorAll("[data-img]").forEach(b=>b.onclick=()=>modal(image(b.dataset.img)));document.querySelectorAll("[data-chat]").forEach(b=>b.onclick=()=>modal(chats()));const sf=document.getElementById("sf");if(sf)sf.onsubmit=e=>{e.preventDefault();const q=document.getElementById("si").value.trim().replace(/^@/,"").toLowerCase();activeProfile=(P.find(x=>x.u===q)||P[0]).u;render()};const ct=document.getElementById("chatTop");if(ct)ct.onclick=()=>modal(chats());const back=document.getElementById("back");if(back)back.onclick=()=>{activeProfile=null;render()};const w=document.getElementById("write");if(w)w.onclick=()=>modal(thread(activeProfile||P[0].u));const s=document.getElementById("save");if(s)s.onclick=()=>modal(settings());const pt=document.getElementById("pt"),st=document.getElementById("st"),g=document.getElementById("grid");if(pt&&st&&g){pt.onclick=()=>{const p=P.find(x=>x.u===activeProfile)||P[0];pt.className="h-11 rounded-md bg-surface text-sm font-medium";st.className="h-11 rounded-md text-sm font-medium text-muted";g.innerHTML=p.posts.map(x=>'<button class="relative aspect-square overflow-hidden rounded-sm bg-elevated" data-img="'+esc(x[1])+'"><img src="'+esc(x[1])+'" class="size-full object-cover"/></button>').join("");wire()};st.onclick=()=>{const p=P.find(x=>x.u===activeProfile)||P[0];st.className="h-11 rounded-md bg-surface text-sm font-medium";pt.className="h-11 rounded-md text-sm font-medium text-muted";g.innerHTML=p.posts.map(x=>'<button class="relative aspect-[9/16] overflow-hidden rounded-md bg-elevated" data-img="'+esc(x[1])+'"><img src="'+esc(x[1])+'" class="size-full object-cover"/></button>').join("");wire()}}}
function render(){document.getElementById("caption").textContent=activeTab==="instagram"?"Лента":activeTab==="dropbox"?"Файлы":"Imagine";const c=document.getElementById("content");if(activeTab==="dropbox")c.innerHTML=files();else if(activeTab==="imagine")c.innerHTML=imagine();else c.innerHTML=activeProfile?profile():toolbar()+favs()+feed();wire();refreshIcons()}
document.getElementById("settingsBtn").onclick=()=>modal(settings());render();

function refreshIcons(){if(window.lucide&&window.lucide.createIcons)window.lucide.createIcons()}

</script></body></html>
