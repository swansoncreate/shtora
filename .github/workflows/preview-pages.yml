name: preview-pages

on:
  push:
    branches:
      - "concept/midnight"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-preview"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Midnight branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Fetch classic branch
        run: git fetch origin test/vps-grok-imagine:test/vps-grok-imagine

      - name: Install Midnight dependencies
        run: npm ci

      - name: Build Midnight
        run: |
          npm run build:dev
        env:
          SHTORA_PAGES_PREVIEW: "1"
          SHTORA_PAGES_PREVIEW_PATH: "/shtora/midnight/"
          test -d ".vercel/output/static"
          rm -rf site
          mkdir -p site/midnight
          cp -R .vercel/output/static/. site/midnight/
          if [ -f "site/midnight/_shell.html" ]; then
            cp "site/midnight/_shell.html" "site/midnight/index.html"
          fi
          test -f "site/midnight/index.html"
          cp "site/midnight/index.html" "site/midnight/404.html"

      - name: Checkout classic worktree
        run: git worktree add --detach .classic test/vps-grok-imagine

      - name: Install classic dependencies
        working-directory: .classic
        run: npm ci

      - name: Build Classic
        working-directory: .classic
        run: |
          npm run build:dev
        env:
          SHTORA_PAGES_PREVIEW: "1"
          SHTORA_PAGES_PREVIEW_PATH: "/shtora/classic/"
          test -d ".vercel/output/static"
          mkdir -p ../site/classic
          cp -R .vercel/output/static/. ../site/classic/
          if [ -f "../site/classic/_shell.html" ]; then
            cp "../site/classic/_shell.html" "../site/classic/index.html"
          fi
          test -f "../site/classic/index.html"
          cp "../site/classic/index.html" "../site/classic/404.html"

      - name: Create comparison landing page
        run: |
          cat > site/index.html <<'HTML'
          <!doctype html>
          <html lang="ru">
            <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width,initial-scale=1" />
              <title>SHTORA — concept comparison</title>
              <style>
                :root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,sans-serif;background:#070b14;color:#f4f6fb}
                *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 20% 0%,#7c6bff18,transparent 30%),radial-gradient(circle at 100% 20%,#f36b9a14,transparent 28%),#070b14}
                main{width:min(920px,92vw);padding:28px 0}p{color:#8e98aa}.eyebrow{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:#9b8cff;font-weight:800}
                h1{font-size:clamp(40px,7vw,72px);letter-spacing:-.05em;line-height:.95;margin:10px 0 14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:28px}
                a{display:block;padding:24px;border-radius:24px;text-decoration:none;color:inherit;background:#101725;border:1px solid #ffffff14;box-shadow:0 18px 50px #0004;transition:.2s}a:hover{transform:translateY(-2px);border-color:#7c6bff55}
                strong{font-size:18px}.tag{display:inline-block;margin-top:12px;padding:6px 9px;border-radius:999px;background:#7c6bff18;color:#b8adff;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.12em}
                @media(max-width:700px){.grid{grid-template-columns:1fr}}
              </style>
            </head>
            <body>
              <main>
                <div class="eyebrow">SHTORA / VISUAL LAB</div>
                <h1>Выбери, какой Шторой пользоваться.</h1>
                <p>Обе версии собраны из реального приложения. Это отдельные живые превью для сравнения.</p>
                <div class="grid">
                  <a href="/shtora/midnight/"><strong>Midnight</strong><br><span>Новая визуальная система: navy, violet, pink, glass UI.</span><br><span class="tag">новый концепт</span></a>
                  <a href="/shtora/classic/"><strong>Classic</strong><br><span>Текущая версия из ветки test/vps-grok-imagine.</span><br><span class="tag">база для сравнения</span></a>
                </div>
              </main>
            </body>
          </html>
          HTML
          touch site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload comparison artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site

      - name: Deploy comparison
        id: deployment
        uses: actions/deploy-pages@v4
