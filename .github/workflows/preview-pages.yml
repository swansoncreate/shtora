name: preview-pages

on:
  push:
    branches:
      - "test/vps-grok-imagine"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Pages artifact
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site
          cp -R preview/. site/
          touch site/.nojekyll
          echo "Pages preview artifact:"
          find site -maxdepth 3 -type f | sort | head -120

      - name: Upload preview artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
