name: quality

on:
  push:
    branches:
      - main
      - "test/**"
      - "release/**"
      - "fix/**"
  pull_request:
    branches:
      - main
      - "release/**"

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: bash -n scripts/configure-vps-session-auth.sh
      - run: bash -n scripts/deploy-vps-session-auth.sh
      - run: bash -n scripts/deploy-vps-session-auth-prebuilt.sh
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
